# Candidate HSSM 0.5 teaching environment; execution validation is deferred.
# Kept separate from Bambi M1: HSSM 0.5 requires numpy<2.5 and its release
# environment used Bambi 0.19. These pins are source/metadata baselines,
# not evidence that this complete recipe or notebook has run.
name: baygent-hssm
channels:
  - conda-forge
dependencies:
  - python=3.12
  - graphviz
  - pip
  - pip:
    - hssm==0.5.0
    - bambi==0.19.0
    - pymc==6.1.0
    - pytensor==3.1.3
    - numpy==2.4.6
    - ssm-simulators==0.14.0
    - arviz==1.2.0
    - arviz-stats==1.2.0
    - arviz-plots==1.2.0
    - marimo==0.24.2
    - netcdf4
    - h5netcdf
    - pytest
